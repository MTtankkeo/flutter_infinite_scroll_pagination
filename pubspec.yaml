name: flutter_infinite_scroll_pagination
description: This Flutter package offers effortless infinite scroll loading with just one line of wrapping no complex setup or controller needed for easy integration.
version: 1.4.0
publisher: ttankkeo112@gmail.com
repository: https://github.com/MTtankkeo/flutter_infinite_scroll_pagination
topics:
  - infinite-scroll
  - nested-scroll
  - pagination
  - load-more

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0
  flutter_nested_scroll: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
